org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter migrator / AGP 9 temporary escape hatch: many plugins still apply
# kotlin-android. Keep false so those plugins configure. file_picker 11 skips
# applying KGP on AGP >= 9 — see android/build.gradle.kts force-apply.
android.builtInKotlin=false
android.newDsl=false
# Windows + path-with-spaces ("Code Repo") corrupts Kotlin incremental caches.
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.incremental.js=false
